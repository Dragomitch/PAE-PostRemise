services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-testdb}
      - POSTGRES_USER=${DB_USERNAME:-pguser01}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-yoursecurepassword}
    # The database starts empty: the backend's Flyway migrations create the student_exchange_tools
    # schema and its reference data at its first start (ADR 0003). Demo data, by hand:
    # docker compose exec -T db psql -U pguser01 -d testdb -v ON_ERROR_STOP=1 < SQLRessources/demo.sql
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker and
      # declare /var/lib/postgresql as the volume (17 and below used /var/lib/postgresql/data).
      # A volume written by the 16 image cannot be reused as is: pg_upgrade it or start afresh.
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    # Published image of a release (see "Releases" in the README), instead of building from source:
    # image: ghcr.io/dragomitch/pae-postremise-backend:<tag>
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-testdb}
      - DB_USERNAME=${DB_USERNAME:-pguser01}
      - DB_PASSWORD=${DB_PASSWORD:-yoursecurepassword}
      # Set it (32+ bytes) to keep sessions valid across restarts
      - JWT_SECRET=${JWT_SECRET:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # docker stop sends SIGTERM and waits this long before SIGKILL: more than the 20s the
    # application gives the requests in flight (spring.lifecycle.timeout-per-shutdown-phase)
    stop_grace_period: 30s
    healthcheck:
      # /actuator/health answers 200 when the application and the database are up and 503 when one
      # is down (curl --fail turns that into a failure). curl comes with the eclipse-temurin image.
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # start-up (Flyway migrations, Hibernate) takes a few seconds: failures in this window
      # do not count
      start_period: 40s

  frontend:
    # image: ghcr.io/dragomitch/pae-postremise-frontend:<tag>
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data-18:
