# ----- Bean Validation: standard constraints -----
jakarta.validation.constraints.NotBlank.message=must not be blank
jakarta.validation.constraints.NotEmpty.message=must not be empty
jakarta.validation.constraints.NotNull.message=is required
jakarta.validation.constraints.Size.message=${min == 0 ? 'must contain at most' : (min == max ? 'must contain exactly' : 'must contain at least ' += min += ' and at most')} {max} characters
jakarta.validation.constraints.Min.message=must be greater than or equal to {value}
jakarta.validation.constraints.Max.message=must be less than or equal to {value}
jakarta.validation.constraints.Positive.message=must be greater than 0
jakarta.validation.constraints.PositiveOrZero.message=must be greater than or equal to 0
jakarta.validation.constraints.Past.message=must be a date in the past
jakarta.validation.constraints.Email.message=must be a valid email address
jakarta.validation.constraints.Pattern.message=does not have the expected format

# ----- Bean Validation: constraints of the application -----
pae.validation.Iban.message=must be a valid IBAN (for example BE68539007547034, without spaces)
pae.validation.Bic.message=must be a valid BIC code of 8 or 11 characters (for example GEBABEBB)
pae.validation.PhoneNumber.message=must be a valid phone number (digits, leading +, spaces, dots, dashes or slashes)
pae.validation.FilterValueRequired.message=is required with this filter
pae.validation.title.message=must be Mr, M, Mrs or Ms
pae.validation.gender.message=must be M (male), F (female) or O (other)
pae.validation.mobilityType.message=must be SMS (studies) or SMP (internship)
pae.validation.PartnerSearch.filter.message=must be archived or country
pae.validation.MobilityChoiceUcc.filter.message=must be all, active, canceled, rejected or passed
pae.validation.MobilityUcc.documentFilter.message=must be D, DF, R or RF
