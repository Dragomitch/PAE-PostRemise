# Messages of the application, in English. The keys are documented in messages.properties
# (French, the fallback); every key must exist in both files (checked by MessageBundlesTest).
# UTF-8. Use the typographic apostrophe (’): a plain ' is a quote character for the messages
# taking arguments ({0}, {1}...).

