# ----- Bean Validation: standard constraints -----
jakarta.validation.constraints.NotBlank.message=ne peut pas être vide
jakarta.validation.constraints.NotEmpty.message=ne peut pas être vide
jakarta.validation.constraints.NotNull.message=est obligatoire
jakarta.validation.constraints.Size.message=${min == 0 ? 'doit contenir au plus' : (min == max ? 'doit contenir exactement' : 'doit contenir au moins ' += min += ' et au plus')} {max} caractères
jakarta.validation.constraints.Min.message=doit être supérieur ou égal à {value}
jakarta.validation.constraints.Max.message=doit être inférieur ou égal à {value}
jakarta.validation.constraints.Positive.message=doit être strictement positif
jakarta.validation.constraints.PositiveOrZero.message=doit être positif ou nul
jakarta.validation.constraints.Past.message=doit être une date passée
jakarta.validation.constraints.Email.message=doit être une adresse e-mail valide
jakarta.validation.constraints.Pattern.message=n’a pas le format attendu

# ----- Bean Validation: constraints of the application -----
pae.validation.Iban.message=doit être un IBAN valide (par exemple BE68539007547034, sans espaces)
pae.validation.Bic.message=doit être un code BIC valide de 8 ou 11 caractères (par exemple GEBABEBB)
pae.validation.PhoneNumber.message=doit être un numéro de téléphone valide (chiffres, + initial, espaces, points, tirets ou barres obliques)
pae.validation.FilterValueRequired.message=est obligatoire avec ce filtre
pae.validation.title.message=doit être Mr, M, Mrs ou Ms
pae.validation.gender.message=doit être M (masculin), F (féminin) ou O (autre)
pae.validation.mobilityType.message=doit être SMS (études) ou SMP (stage)
pae.validation.PartnerSearch.filter.message=doit être archived ou country
pae.validation.MobilityChoiceUcc.filter.message=doit être all, active, canceled, rejected ou passed
pae.validation.MobilityUcc.documentFilter.message=doit être D, DF, R ou RF
