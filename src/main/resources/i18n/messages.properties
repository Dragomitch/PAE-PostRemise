# Messages of the application, in French: the language of the product and the fallback of every
# other language. English: messages_en.properties. Every key must exist in both files (checked by
# MessageBundlesTest). UTF-8. Use the typographic apostrophe (’) in the texts: a plain ' is a
# quote character for the messages taking arguments ({0}, {1}...).
#
# problem.<CODE>.title / problem.<CODE>.detail: title and detail of the problem (RFC 9457) of each
#   ErrorCode; the detail may use the arguments given to the BusinessException.
# problemDetail.title.<class> / problemDetail.<class>: title and detail of the errors of Spring MVC
#   (Spring's ErrorResponse message codes; the arguments are set by Spring).
# jakarta.validation.constraints.*, pae.validation.*: Bean Validation messages ({min}, {max}...
#   are the attributes of the constraint).

