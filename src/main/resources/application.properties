spring.application.name=pae-gestionnaire-erasmus

# Each request runs on a virtual thread (Java 21): a request blocked on JDBC no longer holds a
# platform thread, so the Tomcat thread pool is not the concurrency limit.
spring.threads.virtual.enabled=true
# On SIGTERM (docker stop, rolling deploy) Tomcat stops accepting connections and lets the
# requests in flight finish before the application context closes.
server.shutdown=graceful
# Longest wait for those requests; Docker kills the container after 10s by default, so
# docker-compose.yml gives the backend a stop_grace_period above this value.
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database: Spring Data JPA (Hibernate) on PostgreSQL. Configure it with the DB_* environment
# variables (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testdb}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# The Flyway migrations (src/main/resources/db/migration) own the schema: Hibernate never generates
# DDL (the integration tests run with ddl-auto=validate, so a mapping that drifts from the schema
# fails the build).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=student_exchange_tools

# Schema migrations (ADR 0003): Flyway applies the pending migrations at start-up, before Hibernate.
# V1__baseline.sql is the schema and reference data of SQLRessources/init.sql; a database created
# from init.sql (no history table yet) is adopted as version 1 without being touched.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The schema of the application, created by Flyway when missing; flyway_schema_history lives in it,
# so reloading init.sql (which drops the schema) also forgets the history.
spring.flyway.schemas=student_exchange_tools
spring.flyway.default-schema=student_exchange_tools
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# The use cases are @Transactional and return DTOs: no lazy loading in the web layer.
spring.jpa.open-in-view=false

# Secret used to sign the session JWT (HMAC-SHA256, at least 32 bytes), read from JWT_SECRET.
# When it is not set, a random key is generated at start-up: sessions then do not survive a
# restart, which is only acceptable for local development.
app.jwt.secret=${JWT_SECRET:}

# Session cookie ("session", HttpOnly, SameSite=Lax) holding the signed JWT issued at sign-in.
# Validity of a session (ISO-8601 or 12h/30m style), overridable with APP_SESSION_VALIDITY.
app.session.validity=${APP_SESSION_VALIDITY:12h}
# Add the Secure attribute to the session and XSRF-TOKEN cookies: set it to true when the
# application is served over HTTPS (APP_SESSION_COOKIE_SECURE=true).
app.session.cookie-secure=${APP_SESSION_COOKIE_SECURE:false}

# Messages (i18n): i18n/messages.properties (French, the language of the product and the
# fallback) and i18n/messages_en.properties. They hold the titles and details of the error
# problems (problem.<CODE>.*, problemDetail.* for the Spring MVC exceptions) and the Bean
# Validation messages: Spring Boot's validator resolves the {key} templates of the constraints
# from this same MessageSource. The request locale comes from Accept-Language (WebConfig).
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
# never fall back on the locale of the server: a missing language falls back on French
spring.messages.fallback-to-system-locale=false
# a missing key is an error (caught by the bundle tests), not the key shown as a message
spring.messages.use-code-as-default-message=false

# JSON (Jackson 3, see JacksonConfig): a null sent for a primitive property (an int id, term,
# version...) is read as 0, as Jackson 2 did, instead of being refused with a 400.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Errors are RFC 9457 problems rendered by ApiExceptionHandler (a ResponseEntityExceptionHandler):
# Spring Boot's own problem-details handler must stay off so that it is not registered twice.
spring.mvc.problemdetails.enabled=false

# Actuator: only /actuator/health and /actuator/info are exposed over HTTP (metrics, env, beans,
# ... stay off). SecurityConfig lets anyone call /actuator/health and requires a session for the rest.
management.endpoints.web.exposure.include=health,info
# The health status (UP/DOWN, database included) is public, so no detail (database product,
# disk space) is shown, whoever asks.
management.endpoint.health.show-details=never
# Adds /actuator/health/liveness and /actuator/health/readiness; the readiness goes down as soon as
# the graceful shutdown starts, so that a load balancer stops sending requests to the instance.
management.endpoint.health.probes.enabled=true

# OpenAPI 3 document (GET /v3/api-docs, /v3/api-docs.yaml) and Swagger UI (/swagger-ui.html),
# generated by springdoc-openapi from the controllers (see OpenApiConfig). Both are public
# (SecurityConfig). The document covers the REST API only, not the web UI routes nor /error.
springdoc.paths-to-match=/api/**
# public on purpose, in production as well: said here so that springdoc does not warn about it
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# the controllers answer JSON unless they declare another type (the CSV exports)
springdoc.default-produces-media-type=application/json
# a request parameter object (PartnerSearch) is documented as its query parameters
springdoc.default-flat-param-object=true
# the error responses come from OpenApiConfig, not from the @ExceptionHandler methods of
# ApiExceptionHandler, which carry no status
springdoc.override-with-generic-response=false
# the tags of the Swagger UI (one per controller) in alphabetical order
springdoc.swagger-ui.tags-sorter=alpha
