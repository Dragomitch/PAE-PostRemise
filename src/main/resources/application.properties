spring.application.name=pae-gestionnaire-erasmus

# Database (the DAOs use plain JDBC through DalServices on top of this pool).
# Configure it with the DB_* environment variables (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:testdb}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Secret used to sign the session JWT (HMAC-SHA256, at least 32 bytes), read from JWT_SECRET.
# When it is not set, a random key is generated at start-up: sessions then do not survive a
# restart, which is only acceptable for local development.
app.jwt.secret=${JWT_SECRET:}
