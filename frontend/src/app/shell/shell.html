<div class="shell-bar">
  <a class="brand" routerLink="/partners">
    <span class="brand-name">EMA</span>
    <span class="brand-tagline" i18n="@@shell.tagline">Gestion des mobilités Erasmus</span>
  </a>

  <nav class="shell-nav" aria-label="Navigation principale" i18n-aria-label="@@shell.nav.ariaLabel">
    <a routerLink="/partners" routerLinkActive="active" ariaCurrentWhenActive="page" i18n="@@shell.nav.partners">Partenaires</a>
  </nav>

  <div class="shell-user">
    <span class="user-name">{{ displayName() }}</span>
    <span class="user-role">{{ roleLabel() }}</span>
    <button type="button" class="sign-out" (click)="signOut()" [disabled]="signingOut()" [attr.aria-busy]="signingOut()">
      @if (signingOut()) {
        <ng-container i18n="@@shell.signingOut">Déconnexion…</ng-container>
      } @else {
        <ng-container i18n="@@shell.signOut">Se déconnecter</ng-container>
      }
    </button>
  </div>
</div>

@if (problem(); as p) {
  <div class="notification notification-danger shell-alert" role="alert">
    <p>{{ p.detail }}</p>
  </div>
}

<div class="shell-content">
  <router-outlet />
</div>
