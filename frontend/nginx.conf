# Serves the localized Angular builds and forwards API calls to the backend container, so the
# browser only talks to one origin and no CORS is involved in the Docker Compose setup.
#
# `ng build` (localize: true) produces one app per locale, each with its own <base href>:
#   /usr/share/nginx/html/fr/  (source locale, default)
#   /usr/share/nginx/html/en/

# Preferred UI language from Accept-Language: the first of fr/en listed wins, default fr.
# (Included inside the `http` block by the official image, where `map` is allowed.)
map $http_accept_language $ema_locale {
  default           fr;
  "~*^\s*en"        en;
  "~*^\s*fr"        fr;
  "~*(^|,)\s*fr\b"  fr;
  "~*(^|,)\s*en\b"  en;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Accept-Language (UI locale) and the XSRF-TOKEN cookie / X-XSRF-TOKEN header are
    # forwarded unchanged (nginx passes client headers by default).
  }

  # Missing static files (anything with an extension) are real 404s, not the SPA page.
  location ~ ^/(fr|en)/.+\.[A-Za-z0-9]+$ {
    try_files $uri =404;
  }

  location ~ ^/(fr|en)$ {
    return 301 /$1/;
  }

  # Client-side routes of each locale fall back to that locale's entry point.
  location /fr/ {
    try_files $uri $uri/ /fr/index.html;
  }

  location /en/ {
    try_files $uri $uri/ /en/index.html;
  }

  # Anything else (/, /signin, old bookmarks...) goes to the preferred locale, keeping the path.
  # 302 + Vary so caches do not pin one language for everybody.
  location / {
    add_header Vary Accept-Language always;
    return 302 /$ema_locale$request_uri;
  }
}
