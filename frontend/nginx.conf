# Serves the Angular build and forwards API calls to the backend container, so the browser
# only talks to one origin and no CORS is involved in the Docker Compose setup.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client-side routes (/signin, /signup, ...) fall back to the SPA entry point.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
