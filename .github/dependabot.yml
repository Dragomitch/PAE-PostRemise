# Dependabot: weekly version updates, grouped so that packages released together are
# bumped together. Angular packages pin each other as exact peers (@angular/router 20.3.32
# requires @angular/common 20.3.32), so a PR updating only one of them fails `npm ci`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # a major Angular version is a migration (ng update), not a dependency bump
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # Left out on purpose, see #136: Angular 20 requires TypeScript < 6 (>=5.8 <6.0), and
      # jasmine-core 7 breaks karma-jasmine-html-reporter (it relies on the HTML reporter that
      # jasmine-core 7 dropped), so @types/jasmine, which follows jasmine-core, stays on 5.x too.
      # Lift each one when the tool that blocks it supports the new major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
      # zone.js follows Angular: @angular/core 20 declares the peer dependency zone.js ~0.15.0, so
      # the 0.16 bump of #152 failed `npm ci` with ERESOLVE. Lift it with the next Angular major.
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The lint tools move with the Angular major: angular-eslint 20.x is the line for Angular 20
      # and declares the eslint and typescript-eslint ranges it works with (#177 and #178 failed
      # `npm ci` on eslint 10 and angular-eslint 22). Bump the three together with ng update.
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]

  # e2e/ has its own package.json and lockfile. The Playwright version there must stay compatible
  # with the Chromium that `npx playwright install` fetches in CI (the e2e job).
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      e2e-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
