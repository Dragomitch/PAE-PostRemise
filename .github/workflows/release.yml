name: Release

# A tag v* on master publishes the two images to GHCR (with SBOM and provenance attestations) and
# creates the GitHub Release. workflow_dispatch with publish=false (the default) is the dry run:
# both images are built, nothing is pushed and no release is created.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the images and create the release (only on a tag; leave unchecked for a dry run)'
        type: boolean
        default: false

# One release per ref at a time; a release in progress is never cancelled half way.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # the GitHub Release
  packages: write       # push to ghcr.io
  id-token: write       # signs the provenance attestation
  attestations: write   # stores the SBOM and provenance attestations

env:
  # Publishing needs a tag: the image tags come from it. A dispatch on a branch is always a dry run.
  PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish) }}

jobs:
  backend:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pae-postremise-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pae-postremise-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release:
    name: GitHub Release
    needs: [ backend, frontend ]
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          # a tag with a hyphen (v1.0.0-rc.1) is a pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Container images

            | Image | Reference | Digest |
            | --- | --- | --- |
            | backend | `${{ needs.backend.outputs.image }}:${{ needs.backend.outputs.version }}` | `${{ needs.backend.outputs.digest }}` |
            | frontend | `${{ needs.frontend.outputs.image }}:${{ needs.frontend.outputs.version }}` | `${{ needs.frontend.outputs.digest }}` |

            Each image carries an SBOM and a provenance attestation, stored next to it in the registry.
