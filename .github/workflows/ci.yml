name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

# A new push to the same PR/branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload backend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (build, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm run test:ci
      - name: Upload frontend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-reports
          path: |
            frontend/reports/junit/
            frontend/coverage/frontend/
          if-no-files-found: warn
          retention-days: 14

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: pipx run actionlint-py -color

  docker:
    name: Docker images & Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  e2e:
    name: End-to-end (API and Playwright on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same image and credentials as docker-compose.yml. Service containers cannot mount
      # files, so init.sql is loaded by a step below.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: pguser01
          POSTGRES_PASSWORD: yoursecurepassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser01 -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: testdb
      DB_USERNAME: pguser01
      DB_PASSWORD: yoursecurepassword
      PGPASSWORD: yoursecurepassword
      SERVER_PORT: '8080'
      APP_URL: http://localhost:8080
      NG_PORT: '4200'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the jar
        run: mvn -B -ntp -q package -DskipTests -Djacoco.skip=true
      - name: Load the schema (SQLRessources/init.sql)
        run: psql -h localhost -U pguser01 -d testdb -v ON_ERROR_STOP=1 -q -f SQLRessources/init.sql
      - name: Start the app
        run: |
          mkdir -p e2e
          # a signing key for this run only
          JWT_SECRET="$(openssl rand -hex 32)" nohup java -jar target/PAE-Gestionnaire-Erasmus-1.0-SNAPSHOT.jar > e2e/app.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # waits for the app, runs api_e2e.py, starts ng serve, runs the Playwright walk
      # (DATECHECK=1) and the mobility detail check
      - name: Run the end-to-end suite
        run: e2e/run-e2e.sh
      - name: Upload screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            e2e/screenshots/
            e2e/app.log
            e2e/ng-serve.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Test report
    needs: [ backend, frontend ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # "Test results" check run with annotations
      pull-requests: write   # sticky summary comment
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          path: reports
          # only our reports: the docker job also uploads *.dockerbuild build records
          pattern: '*-reports'
      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Test results
          report_paths: |
            reports/backend-reports/surefire-reports/TEST-*.xml
            reports/backend-reports/failsafe-reports/TEST-*.xml
            reports/frontend-reports/reports/junit/TEST-*.xml
          detailed_summary: true
          include_time_in_summary: true
          group_suite: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Build CI report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # normalise the artifact layout expected by the script
          mkdir -p norm/backend-reports norm/frontend-reports
          cp -r reports/backend-reports/surefire-reports norm/backend-reports/ 2>/dev/null || true
          cp -r reports/backend-reports/failsafe-reports norm/backend-reports/ 2>/dev/null || true
          cp -r reports/backend-reports/site/jacoco norm/backend-reports/jacoco 2>/dev/null || true
          cp -r reports/frontend-reports/reports/junit norm/frontend-reports/junit 2>/dev/null || true
          cp -r reports/frontend-reports/coverage/frontend norm/frontend-reports/coverage 2>/dev/null || true
          python3 .github/scripts/ci_report.py norm ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-report
          path: ci-report.md

  # Single required status check for branch protection.
  ci-passed:
    name: CI passed
    needs: [ backend, frontend, workflows, docker, e2e, report ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo 'backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} workflows=${{ needs.workflows.result }} docker=${{ needs.docker.result }} e2e=${{ needs.e2e.result }} report=${{ needs.report.result }}'
          for r in '${{ needs.backend.result }}' '${{ needs.frontend.result }}' '${{ needs.workflows.result }}' '${{ needs.docker.result }}' '${{ needs.e2e.result }}' '${{ needs.report.result }}'; do
            [ "$r" = success ] || { echo "::error::A required job did not succeed ($r)"; exit 1; }
          done
