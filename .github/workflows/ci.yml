name: CI

on:
  pull_request:
    # edited: a changed title is checked again (pr-title); the default types ignore it
    types: [ opened, synchronize, reopened, edited ]
  push:
    branches: [ master ]
  workflow_dispatch:
  # nightly.yml runs the whole suite through this trigger (no inputs)
  workflow_call:

# A new push to the same PR/branch cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Upload backend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (build, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22: @hey-api/openapi-ts (npm run api:check) needs Node 22.18 or later
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # the committed client (src/app/core/api/) must be the one generated from openapi.json
      - name: Generated API client up to date
        run: npm run api:check
      # angular-eslint rules (eslint.config.js), then Prettier (.prettierrc): fails on a finding or
      # on a file that `npm run format` would change
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Production build
        run: npm run build
      - name: Unit tests
        run: npm run test:ci
      - name: Upload frontend reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-reports
          path: |
            frontend/reports/junit/
            frontend/coverage/frontend/
          if-no-files-found: warn
          retention-days: 14

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: pipx run actionlint-py -color
      - name: Unit tests of the CI report script
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  pr-title:
    name: Pull request title
    # Pull requests only: there is no title on a push to master or a manual run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 'Check the title is "type: subject" or "type(scope): subject"'
        env:
          # through the environment, never interpolated into the script (script injection)
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|build|ci|docs|test|refactor|chore|perf|style|revert)(\([a-z0-9., /-]+\))?!?: .+'
          if ! printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error title=Pull request title::Expected '<type>: <subject>' or '<type>(<scope>): <subject>' with type one of feat, fix, build, ci, docs, test, refactor, chore, perf, style, revert"
            echo "Got: $TITLE"
            exit 1
          fi

  docker:
    name: Docker images & Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  e2e:
    name: End-to-end (API and Playwright on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same image and credentials as docker-compose.yml. init.sql is loaded by a step below,
      # before the jar starts: Flyway adopts the database as version 1 (baseline) instead of
      # creating the schema, the path of a database created before the migrations (ADR 0003).
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: pguser01
          POSTGRES_PASSWORD: yoursecurepassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pguser01 -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: testdb
      DB_USERNAME: pguser01
      DB_PASSWORD: yoursecurepassword
      PGPASSWORD: yoursecurepassword
      SERVER_PORT: '8080'
      APP_URL: http://localhost:8080
      NG_PORT: '4200'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the jar
        run: mvn -B -ntp -q package -DskipTests -Djacoco.skip=true
      - name: Load the schema at version 1 (SQLRessources/init.sql)
        run: psql -h localhost -U pguser01 -d testdb -v ON_ERROR_STOP=1 -q -f SQLRessources/init.sql
      - name: Start the app
        run: |
          mkdir -p e2e
          # a signing key for this run only
          JWT_SECRET="$(openssl rand -hex 32)" nohup java -jar target/PAE-Gestionnaire-Erasmus-1.0-SNAPSHOT.jar > e2e/app.log 2>&1 &
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      # frontend/openapi.json, the input of the generated client, must be the document this jar
      # serves, normalized the same way (scripts/sync-openapi.mjs: sorted keys, no servers)
      - name: OpenAPI document of the frontend up to date
        run: |
          for _ in $(seq 60); do
            curl -fsS -o /dev/null --max-time 5 "$APP_URL/v3/api-docs" && break
            sleep 2
          done
          API_DOCS_URL="$APP_URL/v3/api-docs" node frontend/scripts/sync-openapi.mjs --out "$RUNNER_TEMP/openapi.json"
          if ! diff -u frontend/openapi.json "$RUNNER_TEMP/openapi.json"; then
            echo "::error file=frontend/openapi.json::frontend/openapi.json differs from the document served by the backend: run npm run api:sync && npm run api:generate in frontend/ (backend running) and commit the result"
            exit 1
          fi
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # waits for the app, runs api_e2e.py, starts ng serve, runs the Playwright walk
      # (DATECHECK=1) and the mobility detail check
      - name: Run the end-to-end suite
        run: e2e/run-e2e.sh
      - name: Upload screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            e2e/screenshots/
            e2e/app.log
            e2e/ng-serve.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Test report
    needs: [ backend, frontend ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # "Test results" check run with annotations
      pull-requests: write   # sticky summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
          # only our reports: the docker job also uploads *.dockerbuild build records
          pattern: '*-reports'
      - name: Publish test results
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          check_name: Test results
          report_paths: |
            reports/backend-reports/surefire-reports/TEST-*.xml
            reports/backend-reports/failsafe-reports/TEST-*.xml
            reports/frontend-reports/reports/junit/TEST-*.xml
          detailed_summary: true
          include_time_in_summary: true
          group_suite: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Build CI report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # normalise the artifact layout expected by the script
          mkdir -p norm/backend-reports norm/frontend-reports
          cp -r reports/backend-reports/surefire-reports norm/backend-reports/ 2>/dev/null || true
          cp -r reports/backend-reports/failsafe-reports norm/backend-reports/ 2>/dev/null || true
          cp -r reports/backend-reports/site/jacoco norm/backend-reports/jacoco 2>/dev/null || true
          cp -r reports/frontend-reports/reports/junit norm/frontend-reports/junit 2>/dev/null || true
          cp -r reports/frontend-reports/coverage/frontend norm/frontend-reports/coverage 2>/dev/null || true
          python3 .github/scripts/ci_report.py norm ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ci-report
          path: ci-report.md

  # Single required status check for branch protection.
  ci-passed:
    name: CI passed
    needs: [ backend, frontend, workflows, pr-title, docker, e2e, report ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo 'backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} workflows=${{ needs.workflows.result }} pr-title=${{ needs.pr-title.result }} docker=${{ needs.docker.result }} e2e=${{ needs.e2e.result }} report=${{ needs.report.result }}'
          for r in '${{ needs.backend.result }}' '${{ needs.frontend.result }}' '${{ needs.workflows.result }}' '${{ needs.docker.result }}' '${{ needs.e2e.result }}' '${{ needs.report.result }}'; do
            [ "$r" = success ] || { echo "::error::A required job did not succeed ($r)"; exit 1; }
          done
          # pr-title only runs on pull requests: skipped is fine on push, workflow_dispatch and workflow_call, never on a pull request.
          # Inside a called workflow github.event_name is the caller's event (schedule, workflow_dispatch), so the
          # test is "anything but pull_request" and needs no case for each trigger.
          t='${{ needs.pr-title.result }}'
          if [ "$t" != success ] && ! { [ "$t" = skipped ] && [ '${{ github.event_name }}' != pull_request ]; }; then
            echo "::error::The pull request title check did not succeed ($t)"
            exit 1
          fi
