name: Nightly

# Every night the whole CI runs again on master, next to a dependency and vulnerability report.
# A failure opens (or updates) one issue "Nightly build failed"; a green night closes it.
# The schedule only fires on the default branch. Manual run: Actions tab, Nightly, Run workflow.
on:
  schedule:
    # 03:17 UTC, off the :00 and :30 marks where the scheduler is busiest
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# A called workflow cannot hold more permissions than its caller, so the ones the report job of
# ci.yml asks for (checks, pull-requests) are granted here as well.
permissions:
  contents: read
  issues: write
  actions: read
  checks: write
  pull-requests: write

jobs:
  suite:
    name: Full suite (ci.yml)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  dependencies:
    name: Dependency and vulnerability report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Collect the reports here
        run: mkdir -p target
      # Both audits run, whatever the first says, so that the issue and the reports show everything.
      - name: Install the frontend packages
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/target/npm-audit-frontend.json" || true
          npm audit --omit=dev --audit-level=high
      - name: Install the end-to-end packages
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: npm audit (e2e)
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: |
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/target/npm-audit-e2e.json" || true
          npm audit --omit=dev --audit-level=high
      # Report only: the plugin is not declared in pom.xml, hence the full coordinates and the pinned version
      - name: Maven dependency and plugin updates
        if: ${{ !cancelled() }}
        run: >-
          mvn -B -ntp
          org.codehaus.mojo:versions-maven-plugin:2.23.0:display-dependency-updates
          org.codehaus.mojo:versions-maven-plugin:2.23.0:display-plugin-updates
          -DprocessDependencyManagement=false
          > target/dependency-updates.txt
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-reports
          path: |
            target/dependency-updates.txt
            target/npm-audit-frontend.json
            target/npm-audit-e2e.json
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Issue on failure
    needs: [ suite, dependencies ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SUITE_RESULT: ${{ needs.suite.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/nightly_issue.sh
